# Config for Dependabot to automatically update dependencies
# See documentation: https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates

version: 2
updates:
  # Enable version updates for .NET dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "chrismuench"
    labels:
      - "dependencies"
      - "nuget"
    ignore:
      # Avalonia 12 is a major upgrade, not a bump: the Dependabot PRs for it
      # (11.3.x -> 12.1.x, #9-#13) all failed CI, and the migration needs real
      # API work. Blocking majors only keeps 11.3.x patch and minor updates
      # flowing, and leaves security updates untouched - Dependabot applies a
      # `versions:` list to security updates as well, so filtering by version
      # here would have silently suppressed a future advisory against 11.x.
      # The only accepted update-types are version-update:semver-patch /
      # -minor / -major; any other string is dropped without error.
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Enable version updates for npm (if any dev dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
