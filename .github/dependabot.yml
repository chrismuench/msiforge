# Config for Dependabot to automatically update dependencies
# See documentation: https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates

version: 2
updates:
  # Enable version updates for .NET dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "chrismuench"
    labels:
      - "dependencies"
      - "nuget"
    ignore:
      # Avalonia 12 is a major upgrade, not a bump: all four Dependabot PRs for
      # it (11.3.x -> 12.1.x) failed CI, and the migration needs real API work.
      # Holding at 11.x stops the PRs being reopened every week. Scoped to
      # version-updates, so a security advisory against 11.x still gets a PR.
      - dependency-name: "Avalonia*"
        update-types: ["version-updates"]
        versions:
          - ">= 12.0.0"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Enable version updates for npm (if any dev dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
