# Builds the thing people actually download: one self-contained executable per
# platform, no .NET runtime to install first.
#
# Triggered by a version tag, and runnable by hand so a release can be rehearsed
# without tagging anything.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   asset: MsiForge-windows-x64.exe }
          - { os: windows-latest, rid: win-arm64, asset: MsiForge-windows-arm64.exe }
          - { os: macos-latest,   rid: osx-arm64, asset: MsiForge-macos-arm64 }
          - { os: macos-latest,   rid: osx-x64,   asset: MsiForge-macos-x64 }
          - { os: ubuntu-latest,  rid: linux-x64, asset: MsiForge-linux-x64 }

    runs-on: ${{ matrix.os }}
    # The Azure trust is scoped to this environment, so the federated credential
    # only accepts tokens minted for it - see docs/RELEASE-SIGNING.md. Heads up:
    # any approval gate on the environment holds all five matrix jobs, not just
    # the two that sign.
    environment: release
    # id-token: write is what lets the runner exchange its identity for an Azure
    # token without storing a password in this repo. contents stays read here: the
    # only job that needs write is publish.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The tests gate the release. A package that builds but does not install is
      # exactly the failure this project exists to prevent, so shipping one
      # untested would be the wrong kind of irony.
      - name: Test
        run: dotnet test tests/MsiForge.Tests/MsiForge.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/MsiForge.App/MsiForge.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true -o out

      # Proves the published binary runs on a clean runner with no .NET installed
      # beyond the SDK - and that its CLI half is wired up, which a GUI-only smoke
      # test would not catch. Skipped for win-arm64: the Windows runners are x64
      # and cannot execute an ARM64 binary (it exits 126), so running it there
      # would only prove the runner's architecture. The Test step above already
      # exercised the code on this runner.
      - name: Smoke test the published binary
        if: matrix.rid != 'win-arm64'
        shell: bash
        run: |
          exe=out/MsiForge
          [ -f "$exe.exe" ] && exe="$exe.exe"
          chmod +x "$exe" 2>/dev/null || true
          "$exe" doctor
          "$exe" selftest

      - name: Name the asset
        shell: bash
        run: |
          src=out/MsiForge
          [ -f "$src.exe" ] && src="$src.exe"
          mv "$src" "${{ matrix.asset }}"

      # ------------------------------------------------------------------ signing
      # Authenticode is a PE thing, so only the two Windows binaries are signed.
      # The macOS and Linux files are shipped as they are, and the release notes
      # say so rather than leaving people to discover it from Gatekeeper.
      #
      # Deliberately after the smoke test and the rename: the bytes verified here
      # are the bytes uploaded, so nothing can drift between the two.
      - name: Check signing is configured
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for pair in "repo variable AZURE_SIGNING_ENDPOINT=$ENDPOINT" \
                      "repo variable AZURE_SIGNING_ACCOUNT=$ACCOUNT" \
                      "repo variable AZURE_CERTIFICATE_PROFILE=$PROFILE" \
                      "secret AZURE_TENANT_ID=$TENANT" \
                      "secret AZURE_CLIENT_ID=$CLIENT" \
                      "secret AZURE_SUBSCRIPTION_ID=$SUB"; do
            name="${pair%%=*}"; val="${pair#*=}"
            if [ -z "$val" ]; then echo "::error::$name is not set - refusing to publish an unsigned binary."; missing=1; fi
          done
          exit $missing

      - name: Azure login
        if: matrix.os == 'windows-latest'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        if: matrix.os == 'windows-latest'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\${{ matrix.asset }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: MsiForge
          description-url: https://chrismuench.github.io/msiforge/

      # Not "log the status": a release whose signature does not verify should
      # fail here rather than surface as a SmartScreen warning on a customer's
      # desktop three weeks from now.
      - name: Verify the signature
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $asset = "${{ matrix.asset }}"
          $sig = Get-AuthenticodeSignature $asset
          if ($sig.Status -ne 'Valid') {
            throw "$asset is not validly signed (status $($sig.Status): $($sig.StatusMessage))"
          }
          & signtool.exe verify /pa /v $asset
          if ($LASTEXITCODE -ne 0) { throw "signtool rejected the signature on $asset" }
          "signed by   : $($sig.SignerCertificate.Subject)"
          "thumbprint  : $($sig.SignerCertificate.Thumbprint)"
          "timestamped : $(if ($sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Subject } else { 'NO - signature will expire with the certificate' })"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with: { path: assets, merge-multiple: true }

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            One file per platform. Download it and run it - there is no installer
            and no .NET runtime to install first.

            The two Windows binaries are Authenticode-signed with Azure Artifact
            Signing (SHA-256 file digest, RFC 3161 timestamp). The macOS and Linux
            binaries are **not** signed: Authenticode has no equivalent there, and
            macOS code signing plus notarisation is a separate task.

            The same binary is both the desktop app and the command line: run it
            with no arguments for the window, or with a command for the CLI.

                MsiForge-windows-x64.exe build myapp.msiforge
                MsiForge-windows-x64.exe doctor

            **macOS**: the binary is not notarised, so Gatekeeper will refuse it
            on first run. Clear the quarantine flag once:

                xattr -d com.apple.quarantine ./MsiForge-macos-arm64
                chmod +x ./MsiForge-macos-arm64

            **Linux**: `chmod +x` before running.
