# The website lives on this branch and nowhere else, so its deployment lives
# here too. GitHub reads push-event workflows from the branch being pushed, so a
# workflow that deploys gh-pages has to exist on gh-pages.
#
# The artifact is assembled by hand from a file list. Uploading '.' is what
# published the entire source tree to the public site once already, and an
# unknown input like `exclude:` is silently ignored rather than rejected - so
# this stays explicit, and adding a file to the site means adding it here.
name: Deploy site

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site
          for f in index.html robots.txt sitemap.xml \
                   og-image.png favicon.svg favicon.png apple-touch-icon.png; do
            install -m 644 "$f" "_site/$f"
          done
          touch _site/.nojekyll

      # Pinned exactly, because this output is the site's appearance and a silent
      # drift in what gets purged would be invisible until someone loaded the page.
      # Node is preinstalled on the runner, so there is no setup step to keep in
      # sync with a version file.
      - name: Build the stylesheet
        run: npx --yes tailwindcss@3.4.19 -c tailwind.config.js -i input.css -o _site/tailwind.css --minify

      # An empty or truncated stylesheet would still deploy and render the page as
      # unstyled HTML, so fail here rather than publish that.
      - name: Verify the stylesheet
        run: |
          set -e
          size=$(wc -c < _site/tailwind.css)
          echo "tailwind.css: $size bytes"
          test "$size" -gt 8000
          grep -q 'hidden' _site/tailwind.css

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
